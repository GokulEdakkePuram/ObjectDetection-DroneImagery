name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      # The test suite deliberately covers only what runs without the 2 GB
      # dataset or a GPU: tiling geometry and config composition.
      - name: Test
        run: uv run pytest
